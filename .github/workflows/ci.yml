# CI do próprio kit — valida o que o instalador entrega.
# (O kit ensina "verify, don't claim"; isso aqui é a regra valendo pra ele mesmo.)
name: ci

# push só na main: com `push:` aberto, todo push de branch com PR rodava a suíte duas vezes
# (push e pull_request). Branch sem PR fica sem CI até abrir o PR.
on:
  push:
    branches: [main]
  pull_request:

# Sem esta linha o GITHUB_TOKEN do job herda a permissão default da organização,
# que costuma ser write em contents/issues/PRs. Este CI só lê o repositório para
# rodar os testes — nada aqui escreve. Alerta #8 do code scanning
# (actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Era 10. Em 22/10/2026 três runs estouraram o teto no apt do ffmpeg (passo lento do
    # runner, não teste travado) e saíram CANCELLED; com a suíte maior, 10 min não sobra.
    timeout-minutes: 20
    steps:
      # Actions pinadas por SHA (tag móvel pode ser reescrita por quem controla o repo da
      # action); o Dependabot (.github/dependabot.yml) abre o PR de atualização.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: JSONs do plugin são válidos
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugin/.claude-plugin/plugin.json \
                   plugin/hooks/hooks.json \
                   plugin/templates/settings.json \
                   skills.sh.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done

      - name: Link relativo, âncora e href/src dos .md resolvem, e todo .json parseia
        # Inclui o link absoluto deste repo (github.com/<dono>/<repo>/blob/main/…#âncora),
        # conferido como caminho local; dono e repo saem do origin do checkout.
        run: bash tests/test-docs-consistencia.sh

      - name: Nada em plugin/ manda rodar pacote sem versão nem sobe MCP sozinho
        # @latest, npx -y sem @versão, instalador global sem versão e .mcp.json/mcpServers.
        # Exceção em tests/pin-versao.allow, por arquivo:linha e com motivo.
        run: bash tests/test-pin-versao.sh

      - name: Toda action dos workflows é pinada por SHA, com a versão em comentário
        run: bash tests/test-actions-por-sha.sh

      - name: Nada versionado carrega dado de cliente (nome, telefone real, host UAZAPI)
        run: bash tests/test-sem-dado-de-cliente.sh

      - name: A QA simulada da n8n-workflow-agent reprova o agente quando deve e limpa depois
        run: bash tests/test-simular-conversa.sh

      - name: A versão do plugin bate com a do kit-setup
        run: |
          v_plugin="$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          v_setup="$(awk -F'"' '/^KIT_VERSION=/{print $2; exit}' plugin/scripts/kit-setup.sh)"
          v_inst="$(awk -F'"' '/^KIT_VERSION=/{print $2; exit}' install.sh)"
          echo "plugin=$v_plugin kit-setup=$v_setup install=$v_inst"
          [ "$v_plugin" = "$v_setup" ] && [ "$v_plugin" = "$v_inst" ]

      - name: Mexeu no plugin? A versão tem que subir
        # O Claude Code decide se baixa a atualização pela `version` do plugin.json.
        # Publicar mudança sem bumpar deixa quem já instalou com a cópia antiga em
        # cache — sem erro, sem aviso, e a gente só descobre quando alguém reclama
        # de um problema que já foi corrigido.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if [ -z "$(git diff --name-only "$base"...HEAD -- plugin/)" ]; then
            echo "plugin/ intocado — nada a checar"; exit 0
          fi
          ver() { python3 -c "import json,sys;print(json.load(sys.stdin)['version'])"; }
          v_base="$(git show "$base:plugin/.claude-plugin/plugin.json" | ver)"
          v_head="$(ver < plugin/.claude-plugin/plugin.json)"
          echo "plugin/ mudou · versão $v_base → $v_head"
          if [ "$v_base" = "$v_head" ]; then
            echo "::error::plugin/ mudou e a versão continua $v_head. Quem já instalou fica com a cópia em cache e não recebe esta mudança. Suba a versão nos três lugares (plugin.json, install.sh, kit-setup.sh) e acrescente a entrada no CHANGELOG."
            exit 1
          fi

      - name: O merge do settings entrega o deny e preserva o que é seu
        run: bash tests/test-merge-settings.sh

      - name: env-tem-chave diz se a chave existe sem nunca imprimir o valor
        run: bash tests/test-env-tem-chave.sh

      - name: O check-careful não interrompe à toa (e ainda pega o destrutivo)
        run: bash tests/test-check-careful.sh

      - name: O check-careful lê o payload do Codex (comando em array, pasta em workdir)
        run: bash tests/test-check-careful.sh --codex

      - name: A fila de pendentes do núcleo não mente (tests/esperado-falhar.txt)
        run: bash tests/test-esperado-falhar.sh

      - name: O cleanup do git-sync não pula branch mergeada nem apaga trabalho vivo
        run: bash tests/test-git-sync-cleanup.sh

      - name: O cleanup do git-sync prova pela API sem gh e lista a remota sua sem cópia local
        run: bash tests/test-git-sync-cleanup-sem-gh.sh

      - name: O cleanup do git-sync aceita o tip atrás do head do PR e só chama de "avançou" o que avançou
        run: bash tests/test-git-sync-cleanup-head-pr.sh

      - name: O git-sync acha a conta do gh que enxerga o repo, e avisa qual usou
        run: bash tests/test-git-sync-conta.sh

      - name: O git-sync lê o mural da equipe e não inventa aviso sem mural
        run: bash tests/test-git-sync-mural.sh

      - name: O git-sync não manda pushar branch que já foi mergeada por squash
        run: bash tests/test-git-sync-aviso-push.sh

      - name: O --voltar-main do git-sync só troca de branch quando é seguro
        run: bash tests/test-git-sync-voltar-main.sh

      - name: O gh do git-sync consulta o repo do origin, não o upstream que ele preferiria
        run: bash tests/test-git-sync-gh-repo-origin.sh

      - name: O risco de conflito do git-sync não acusa sobreposição em branch cuja base é o tip da default
        run: bash tests/test-git-sync-risco-conflito.sh

      - name: O modo time do git-sync conta autor por nome, valida o --since e filtra os mergeados no servidor
        run: bash tests/test-git-sync-modo-time.sh

      - name: O worktree-gc só apaga worktree cuja branch está mesmo mergeada
        run: bash tests/test-worktree-gc.sh

      - name: O worktree-gc e o aviso de worktree mergeado buscam o head do PR que não está no clone
        run: bash tests/test-worktree-gc-head-pr.sh

      - name: A limpeza-mac só apaga worktree, branch e build seguros por construção, e sai limpa fora do macOS
        # Aqui é Ubuntu: o teste põe um `uname` de mentira que responde Darwin, e um que
        # responde Linux para provar a saída limpa. O gh e o worktree-gc --verificar são stubs.
        run: bash tests/test-limpeza-mac.sh

      - name: O aviso de git da sessão lê o cwd do payload, não acusa branch sem commit e faz fetch 1x a cada 10 min
        run: bash tests/test-warn-branch-worktree.sh

      - name: O memoria-link não perde projeto sem transcript nem escreve README sem pedir
        run: bash tests/test-memoria-link.sh

      - name: O estado do repo volta no SessionStart(compact), lido do cwd do payload, sem tocar no repo
        run: bash tests/test-precompact.sh

      - name: O modelo de .worktreeinclude copia o env ignorado e deixa token de registry de fora
        run: bash tests/test-worktreeinclude-exemplo.sh

      - name: O hook de regra por caminho injeta uma vez e nunca bloqueia
        run: bash tests/test-path-rules.sh

      - name: Nenhum hook, em evento nenhum, chama o dispatch do dotcontext
        run: bash tests/test-hooks-boot.sh

      - name: O aviso de novidades conta as versões certas e não repete o pedido de reload
        run: bash tests/test-warn-kit-updated.sh

      - name: Leitura relativa depois de cd é bloqueada, e comando legítimo não
        run: bash tests/test-block-cd-leitura-relativa.sh

      - name: Checkout no clone que outra sessão usa é bloqueado; worktree é livre
        run: bash tests/test-block-parallel-clone-switch.sh

      - name: Checkout no clone que outra sessão usa é bloqueado (payload do Codex)
        run: bash tests/test-block-parallel-clone-switch.sh --codex

      - name: O merge com --delete-branch não fecha PR encadeado
        run: bash tests/test-block-delete-branch.sh

      - name: O merge com --delete-branch não fecha PR encadeado (payload do Codex)
        run: bash tests/test-block-delete-branch.sh --codex

      - name: O session-size-guard avisa pelo contexto real, uma vez por faixa, e a faixa acompanha o /compact
        run: bash tests/test-session-size-guard.sh

      - name: O instrucoes-projeto classifica o par CLAUDE.md/AGENTS.md e só grava o que não pede julgamento
        run: bash tests/test-instrucoes-projeto.sh

      - name: O kit-setup respeita o .keep-local e mantém só 3 backups
        run: bash tests/test-kit-setup-keep-local.sh

      - name: O kit-setup tira o agents.md antigo e deixa intocado o AGENTS.md da pessoa
        # No ubuntu o disco diferencia maiúscula: roda o caso (d). O (b), que só existe em
        # disco que não diferencia (Mac, Windows), roda na máquina de quem mantém.
        run: bash tests/test-kit-setup-subagentes.sh

      - name: O setup em HOME temporário termina em auto e sem allow de execução arbitrária
        run: bash tests/test-kit-setup-permissoes.sh

      - name: O kit-setup tira o MCP do dotcontext de quem ainda o tem registrado
        run: bash tests/test-kit-setup-dotcontext.sh

      - name: Com o kit do time na máquina, os hooks do plugin saem sem fazer nada
        # Sem a guarda, cada hook rodava duas vezes: dois sons por turno, texto repetido no
        # contexto e corrida no dotcontext. KIT_VAMOO_HOOKS=1 religa para teste.
        run: bash tests/test-hooks-convidado.sh

      - name: O lint roda no Stop, só no que a sessão anotou, e o eslint saiu do PostToolUse
        run: bash tests/test-lint-modificados.sh

      - name: As cinco versões do kit dizem a mesma coisa
        # plugin.json, plugin/scripts/kit-setup.sh, install.sh, o topo do CHANGELOG e o
        # topo do plugin/novidades.txt (o aviso de novidades do SessionStart lê esse arquivo).
        # O step acima compara os três primeiros; este cobre o CHANGELOG e pega
        # versão repetida — o sintoma de dois PRs que bumparam para o mesmo número.
        run: bash tests/test-versao-changelog.sh

      - name: O guard de commit na main não bloqueia quem só escreve um script
        # A suíte inteira (42 casos, incluindo heredoc) nunca rodou aqui: o CI só tinha o
        # teste de fumaça inline mais abaixo. O gate no fim deste arquivo evita a recaída.
        run: bash tests/test-block-main-commit.sh

      - name: O guard de commit na main lê o payload do Codex
        run: bash tests/test-block-main-commit.sh --codex

      - name: O corpo da release sai certo do CHANGELOG
        # release.yml publica o bloco da versão recortado por .github/scripts/changelog-bloco.sh.
        run: bash tests/test-changelog-bloco.sh

      - name: O dispatcher do PreToolUse devolve o que os cinco hooks devolviam separados, e hook com bug não desliga os seguintes
        run: bash tests/test-pre-bash.sh

      - name: O rtk-claude não reescreve git em worktree, git push, segredo nem saída consumida
        # Porte do kit do time (F3 do #241): último da cadeia do pre-bash, inerte sem rtk.
        run: bash tests/test-rtk-claude.sh

      - name: O grupo de controle do rtk sorteia só o elegível e o relatório mede por família
        run: bash tests/test-rtk-holdout.sh

      - name: O rtk-codex não reescreve o que o check-careful vigia, git em worktree nem git push
        # Porte do kit do time (F5 do #241). A guarda é superset dos gatilhos do check-careful.
        run: bash tests/test-rtk-codex.sh

      - name: O espelho do Codex atualiza só o guard que já está lá, quando a versão muda
        run: bash tests/test-codex-espelho.sh

      - name: O codex-optimize aponta skill desligada no config do Codex
        run: bash tests/test-codex-optimize-skills.sh

      - name: O dispatcher do UserPromptSubmit devolve o que os três hooks devolviam
        run: bash tests/test-pre-prompt.sh

      - name: Sem node, os guards falham aberto e a sessão fica sabendo (uma vez)
        run: bash tests/test-warn-sem-node.sh

      - name: O check-dev-server barra navegar para localhost fora do ar, mesmo sem jq
        run: bash tests/test-check-dev-server.sh

      - name: O aviso de doc ancorado em SHA distante lê o repo do cwd do payload
        run: bash tests/test-warn-doc-ancorado.sh

      - name: O aviso de Claude Code desatualizado respeita o canal stable, mesmo sem jq
        run: bash tests/test-warn-cli-outdated.sh

      - name: Os zips de downloads/ batem com a skill do plugin
        # downloads/<skill>.zip é o link fixo de quem instala a skill avulsa. Zip velho
        # entregaria a versão antiga calado; o teste regera e compara byte a byte.
        run: bash tests/test-downloads-zip.sh

      - name: Os scripts da otimizar-app passam no node --check e o --compare do layout-snapshot acusa caixa que mudou
        # O runtime-bench e o layout-snapshot abrem Chrome headless, que este runner não tem: aqui
        # roda o que não precisa dele (sintaxe, uso e o --compare, que é a prova de "visual igual").
        run: bash tests/test-otimizar-app-scripts.sh

      - name: A video-watch passa sem rede no resolve-url e o watch.sh reprova sem argumento
        # Sem ffmpeg, a parte de vídeo sai "pulado"; ela roda de verdade no job motion-reel-ffmpeg.
        run: bash tests/test-video-watch.sh

      - name: Nenhuma description passa de 500 chars e o name bate com a pasta
        run: bash tests/test-skill-descriptions.sh

      - name: O scan de skills do projeto reprova casca e o hook fala uma vez por mudança
        run: bash tests/test-skills-projeto.sh

      - name: Go para o validador de spec de skill
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: O frontmatter de toda skill segue a spec (skill-validator v1.6.1)
        run: |
          go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          SKILL_SPEC_STRICT=1 PATH="$(go env GOPATH)/bin:$PATH" bash scripts/skill-spec-check.sh plugin/skills

      - name: O gate de spec reprova erro, tolera warning e não vira falso-verde
        run: bash tests/test-skill-spec.sh

      - name: Nenhuma skill executa shell só de ser carregada
        # Exclamação + crase no corpo de um SKILL.md roda o comando no load e escapa
        # de todo o PreToolUse (testado em 05/09/2026). O gate varre plugin/skills/.
        run: bash tests/test-skill-sem-injecao.sh

      - name: A motion-reel não carrega marca de terceiro e abre/fecha com o marca.png da pessoa
        run: bash tests/test-motion-reel-sem-marca.sh

      - name: O stills.mjs da motion-reel aceita índices com espaço e vírgula e recusa índice inválido
        # Node vem no ubuntu-latest; o Remotion e o ffmpeg do teste são falsos.
        run: bash tests/test-motion-reel-stills-indices.sh

      - name: O QA da motion-reel revisa o motion da folha, o glossário reverso aponta nomes que existem e o storyboard pergunta por que cada coisa se move
        run: bash tests/test-motion-reel-revisao.sh

      - name: O py.sh da motion-reel acha o venv ~/.venvs/motion (macOS e Windows) sem MOTION_PY
        run: bash tests/test-motion-reel-py.sh

      - name: A narração grátis da motion-reel fala por arquivo (say e PowerShell), respeita a gravação da pessoa e explica a voz que falta
        run: bash tests/test-motion-reel-voz.sh

      - name: A legenda do Film da motion-reel sai do vo.json no tempo da voz e recusa tempo estimado
        run: bash tests/test-motion-reel-srt.sh

      - name: A fonte principal que falta derruba o render da motion-reel (render real fora do CI)
        # Sem Remotion instalado aqui o teste sai "pulado"; a prova com render real roda local
        # (MOTION_RENDER_REAL=1 MOTION_PROJETO=<projeto>) e no CI do content-studio-template.
        run: bash tests/test-motion-reel-fonte.sh

      - name: A galeria da motion-reel mostra toda cena e transição do template e devolve o roteiro
        run: bash tests/test-motion-reel-galeria.sh

      - name: Os sons da motion-reel saem da cena (src/sons.mjs) e o impacto põe o pico do SFX no quadro
        # Sem python com numpy a parte do WAV sintético sai "pulada"; a lista de cenas e os tempos rodam.
        run: bash tests/test-motion-reel-sons.sh

      - name: Nenhuma palavra cortada na borda na bancada de pior caso da motion-reel (render real fora do CI)
        # Sem Remotion instalado aqui o teste sai "pulado"; a prova roda local
        # (MOTION_RENDER_REAL=1 MOTION_PROJETO=<projeto>).
        run: bash tests/test-motion-reel-texto.sh

      - name: O briefing de motion tem as cinco partes, a timeline avisa leitura curta e o explicativo vira filme na batida
        run: bash tests/test-motion-reel-briefing.sh

      - name: O texto que o modelo lê não cita caminho inexistente nem instala instrução no lugar errado
        # Caminho do kit que não existe, skill só-slash citada como chamável, frase relativa
        # a versão e o destino real do kit-setup.sh num HOME descartável. Exceções com motivo
        # em tests/lint-instrucoes.allow; entrada órfã reprova.
        run: bash tests/test-lint-instrucoes.sh

      - name: O índice de memória em dois níveis respeita cap e ordem sem perder linha
        run: bash tests/test-memoria-indice.sh

      - name: O relatório da auditoria de segurança sai íntegro do findings.json
        run: bash tests/test-auditoria-relatorio.sh

      - name: A varredura de chaves da auditoria (A4) mostra arquivo:linha, nunca o segredo inteiro
        run: bash tests/test-auditoria-a4-mascara.sh

      - name: O secscan só diz AUSENTE ou SEM LOCKFILE quando falta de verdade, separa FALHOU de AUSENTE e varre a árvore com o gitleaks
        run: bash tests/test-secscan-ferramentas.sh

      - name: O gate --diff da baseline sai 3 com base que não resolve e acusa segredo em qualquer commit do range
        # Inclui o segredo que entra só na resolução de um merge (--diff-merges=first-parent).
        run: bash tests/test-collect-diff-base.sh

      - name: A ship tira o PR do rascunho antes do watch, e PR que ainda vai receber push nasce rascunho
        run: bash tests/test-ship-rascunho.sh

      - name: O pilar 02 da baseline diz quais pastas de migration mediu, e os blocos da skill rodam linha a linha
        run: bash tests/test-baseline-banco.sh

      - name: O modo completo da baseline vê o .env e o JWT untracked fora do .gitignore
        run: bash tests/test-collect-completo-untracked.sh

      - name: O pilar 04 da baseline reconhece isCronAuthorized como guard e acusa a edge function aberta
        run: bash tests/test-baseline-edge-auth.sh

      - name: A barra mede a sessão em tokens, na régua do session-size-guard, e não quebra sem transcript
        run: bash tests/test-statusline-sessao.sh

      - name: O painel da barra (até 7 linhas), o modo que vale e o 👤 só com identidade
        run: bash tests/test-statusline-painel.sh

      - name: O kit-setup grava o modo da barra, preserva o curto de quem já tinha e o wrapper não some
        run: bash tests/test-kit-setup-statusline.sh

      - name: Os agentes do plugin têm name, description e effort válido, e revisor e executor rodam em medium
        # Subagente sem effort herda o da sessão: quem trabalha em max pagava max em todo
        # revisor e todo lote despachado.
        run: bash tests/test-agentes-frontmatter.sh

      - name: O pressure test isola os dois modos do ambiente de quem roda
        # Sem isolar o --com-skill, um "ok" podia vir de outra skill instalada ou do
        # CLAUDE.md da máquina — e aqui quem roda pode ser um mentorado com uma
        # máquina que ninguém revisou.
        run: bash tests/test-pressure-isolamento.sh

      - name: O roteiro humano devolve resposta de gente, não a linha seguinte do roteiro
        # O primeiro bug do hitl-loop (no kit do time): com o roteiro entrando por stdin, o
        # `read` da resposta colhia a próxima diretiva e imprimia `TOCOU=captura ERRO Cole o
        # erro` — plausível o bastante para o agente registrar como evidência.
        run: bash tests/test-hitl-loop.sh

      - name: O medir-sessao compara no mesmo diretório e não lê lista ausente como zero tools
        # Porte do kit do time (F5 do #241).
        run: bash tests/test-medir-sessao.sh

      - name: O boot-guard da monitoramento-infra reata por tier, respeita ORDEM_TIERS e start-first, e o dry-run não toca em nada
        # Swarm de mentira: docker, nsenter, ss e curl são stubs no PATH. O teste exige que o
        # stub tenha sido chamado, porque o runner tem docker de verdade.
        run: bash tests/test-boot-guard.sh

      - name: Nenhum teste ficou de fora deste workflow
        # Sem isto, um tests/test-*.sh novo entra no repo e nunca roda — foi o que
        # aconteceu com o test-block-main-commit.sh, parado desde que foi escrito.
        run: |
          fail=0
          for t in tests/test-*.sh; do
            grep -qF "$t" .github/workflows/ci.yml \
              || { echo "::error file=$t::teste não referenciado em .github/workflows/ci.yml"; fail=1; }
          done
          exit $fail

      - name: O relatório de paridade com o kit do time roda (sem o clone, avisa e sai 2)
        # Aqui no CI o clone do time não existe: o que se prova é que o script não quebra e
        # diz o que fazer. O relatório de verdade roda na máquina de quem mantém os dois.
        run: |
          code=0; bash scripts/paridade.sh > /tmp/paridade.log 2>&1 || code=$?
          cat /tmp/paridade.log
          [ "$code" = 2 ] || { echo "::error::esperava exit 2 sem o clone do time, veio $code"; exit 1; }

      - name: A paridade de arquivos compara hash, data do commit e a lista de exceções
        run: bash tests/test-paridade-arquivos.sh

      - name: Sintaxe dos scripts shell
        run: |
          bash -n install.sh
          bash -n plugin/templates/statusline-command.sh
          find plugin -name '*.sh' -type f -print -exec bash -n {} \;
          node --check plugin/scripts/statusline.js
          node --check plugin/scripts/hookjson.js

      - name: Setup roda limpo em HOME temporário (com --dry-run antes)
        run: |
          export HOME="$(mktemp -d)"
          bash plugin/scripts/kit-setup.sh --dry-run
          bash plugin/scripts/kit-setup.sh
          test -f "$HOME/.claude/CLAUDE.md"
          test -f "$HOME/.claude/subagentes.md"
          test -f "$HOME/.claude/scripts/statusline.js"
          python3 -m json.tool "$HOME/.claude/settings.json" > /dev/null

      - name: Setup não destrói configuração que já existia
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude"
          echo "minhas regras" > "$HOME/.claude/CLAUDE.md"
          echo '{"env":{"MEU":"valor"},"permissions":{"allow":["Bash(pytest:*)"]}}' > "$HOME/.claude/settings.json"
          bash plugin/scripts/kit-setup.sh
          grep -q "minhas regras" "$HOME/.claude/CLAUDE.md"        # CLAUDE.md preservado
          test -f "$HOME/.claude/CLAUDE.kit.md"                    # modelo ficou ao lado
          grep -q '"MEU"' "$HOME/.claude/settings.json"            # env preservado
          grep -q 'pytest' "$HOME/.claude/settings.json"           # allow do usuário preservado
          grep -q 'npm test' "$HOME/.claude/settings.json"         # allow do kit acrescentado

      - name: Guard-rails de git funcionam rodando do plugin
        run: |
          repo="$(mktemp -d)"; cd "$repo"; git init -q -b main
          git config user.email ci@ci; git config user.name ci
          # o hook manda a mensagem de bloqueio pra stderr — sem o 2>&1 o
          # $( ) volta vazio e o teste reprova um hook que funcionou.
          out="$(printf '{"tool_input":{"command":"git commit -m x"},"cwd":"%s"}' "$repo" \
                 | bash "$GITHUB_WORKSPACE/plugin/hooks/block-main-commit.sh" 2>&1 || true)"
          echo "$out" | grep -q BLOQUEADO
          printf '{"tool_input":{"command":"git push --force origin main"}}' \
            | bash "$GITHUB_WORKSPACE/plugin/hooks/check-careful.sh" | grep -q '"ask"'

      - name: Links Markdown internos existem
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          missing = []
          for md in pathlib.Path('.').rglob('*.md'):
              if '.git/' in str(md): continue
              texto = md.read_text(encoding='utf-8', errors='ignore')
              # Bloco de código não contém link. Sem tirar, qualquer JS com
              # `algo[i](...)` — p.ex. console[level](JSON.stringify(...)) — casa
              # com o padrão de link e reprova o PR por engano.
              texto = re.sub(r'```.*?```', '', texto, flags=re.S)
              texto = re.sub(r'`[^`\n]*`', '', texto)
              for target in re.findall(r'\]\(([^)]+)\)', texto):
                  target = target.split('#')[0].strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '<')): continue
                  if not (md.parent / target).exists():
                      missing.append(f'{md}: {target}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('todos os links internos ok')
          EOF

      - name: Frontmatter das skills bate com o nome da pasta
        run: |
          fail=0
          for skill in plugin/skills/*/SKILL.md; do
            dir="$(basename "$(dirname "$skill")")"
            name="$(awk -F': *' '/^name:/{gsub(/\r/,""); print $2; exit}' "$skill")"
            if [ "$name" != "$dir" ]; then
              echo "MISMATCH: $skill (name=$name, pasta=$dir)"; fail=1
            fi
          done
          exit $fail

      - name: O catálogo do skills.sh cobre exatamente as skills que existem
        # skills.sh.json agrupa as skills na página pública do repo, e as duas falhas
        # possíveis são silenciosas: skill nova sem grupo cai no fim da página (o kit
        # anuncia 21 e o catálogo mostra 20 mais uma órfã), e slug de skill renomeada
        # some sem erro nenhum. Nada disso quebra a instalação — por isso é teste.
        run: bash tests/test-skills-sh-catalogo.sh

      - name: O README anuncia o número de skills que existe
        # Três frases do README dizem quantas skills o kit tem. Em 15/10/2026 uma dizia 25
        # e as outras 26, com 26 pastas: skill nova entra e um dos números fica para trás.
        run: bash tests/test-readme-contagem.sh

      - name: O gitignore de projeto segura o que é da máquina e deixa passar o do time
        # .env.* fora e .env.example dentro; settings.local.json e worktrees fora,
        # settings.json, agents e skills do projeto dentro.
        run: bash tests/test-gitignore-exemplo.sh

      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-git --redact

      - name: Dependências vulneráveis (osv-scanner)
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.1/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          code=0; osv-scanner scan source -r . || code=$?
          # exit 128 = "No package sources found" — o kit é só markdown + shell, sem
          # manifest de deps (package.json/requirements.txt). Nada a escanear = ok.
          # Outros códigos (ex: 1 = vulnerabilidade encontrada) continuam falhando.
          # Único manifest hoje: o lock do template da motion-reel (pin do Remotion). Vermelho
          # aqui num PR que não toca a skill = advisory novo; suba o pacote nesse lock.
          if [ "$code" = "128" ]; then echo "sem manifests de dependência — nada a escanear"; exit 0; fi
          exit "$code"

  # Mentorado e mantenedor usam Mac, e a diferença que pega é a do bash 3.2, do BSD sed/date
  # e do mktemp. Até a 0.66 a suíte só rodava no Mac de quem mantém. Fase F0 do núcleo único
  # (#241). Job separado, não matriz no validate: o `validate` é check obrigatório pelo nome.
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: A suíte inteira roda no macOS
        run: |
          fail=0
          for t in tests/test-*.sh; do
            if bash "$t" > "/tmp/$(basename "$t").log" 2>&1; then echo "ok   $t"
            else echo "::error file=$t::reprovou no macOS"; tail -20 "/tmp/$(basename "$t").log"; fail=1; fi
            # Suíte de guard com modo --codex (F1 do #241) roda também no payload do Codex.
            grep -q -- '"--codex"' "$t" || continue
            if bash "$t" --codex > "/tmp/$(basename "$t").codex.log" 2>&1; then echo "ok   $t --codex"
            else echo "::error file=$t::reprovou no macOS (--codex)"; tail -20 "/tmp/$(basename "$t").codex.log"; fail=1; fi
          done
          exit $fail

  # O kit promete funcionar no Windows com o Git Bash (README, "Funciona no Windows?"), e é
  # lá que um hook quebrado falha aberto sem ninguém ver: o guard sai 0 e nada protege. Este
  # job roda o boot dos hooks e as suítes dos guard-rails no bash do Git para Windows, com o
  # node do runner, como na máquina de quem instala.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ambiente (bash, node, git)
        run: |
          bash --version | head -1
          node --version
          git --version
          uname -a

      # O que o MSYS faz e os testes daqui contornam (#220): caminho /tmp/... passado a
      # programa nativo (node, python) por variável ou argumento vira C:/.../Temp/..., e o
      # escrito dentro do código não vira nada; `ln -s` copia o .exe, e a cópia não
      # carrega longe da msys-2.0.dll. E python não é pré-requisito do kit, node é.
      # No PR roda um subconjunto: sempre o boot dos hooks e o pre-bash, mais a suíte cujo
      # arquivo o PR mudou ou que cita um arquivo de plugin/ que o PR mudou (a suíte nomeia o
      # hook que testa). No push da main roda a lista inteira: o que escapar do PR aparece lá.
      - name: Boot dos hooks e guard-rails no Git Bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          lista="test-hooks-boot test-pre-bash test-block-main-commit
                 test-check-careful test-block-parallel-clone-switch
                 test-block-delete-branch test-block-cd-leitura-relativa
                 test-pre-prompt test-path-rules test-rtk-claude
                 test-merge-settings test-warn-sem-node test-check-dev-server"
          sel="$lista"
          if [ "$EVENTO" = pull_request ]; then
            mudou="$(git diff --name-only "origin/$BASE...HEAD")"
            sel="test-hooks-boot test-pre-bash"
            for t in $lista; do
              case " $sel " in *" $t "*) continue ;; esac
              for f in $mudou; do
                case "$f" in
                  "tests/$t.sh") sel="$sel $t"; break ;;
                  plugin/*) grep -qF -- "${f#plugin/}" "tests/$t.sh" && { sel="$sel $t"; break; } ;;
                esac
              done
            done
            echo "PR: subconjunto do Windows: $sel"
          fi
          falhas=""
          for t in $sel; do
            echo "::group::$t"
            if bash "tests/$t.sh"; then echo "ok $t"; else falhas="$falhas $t"; fi
            if grep -q -- '"--codex"' "tests/$t.sh"; then
              if bash "tests/$t.sh" --codex; then echo "ok $t --codex"; else falhas="$falhas $t--codex"; fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$falhas" ]; then echo "::error::falharam no Windows:$falhas"; exit 1; fi

  # Não reprova. Divergência de skill/hook com o kit do time é aviso: o porte é manual
  # e parte da diferença é de propósito (scripts/paridade.ignore). Se o GITHUB_TOKEN
  # não enxerga o claude-config-team privado, o job pula com aviso.
  paridade-conteudo:
    name: paridade de skills e hooks (só avisa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tenta clonar o claude-config-team
        id: time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh repo clone VAMOO-AI/claude-config-team /tmp/claude-config-team; then
            echo "acessivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "acessivel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::O token do Actions não leu o claude-config-team privado. Paridade de conteúdo pulada."
          fi

      - name: Compara skills e hooks e só avisa
        if: steps.time.outputs.acessivel == 'true'
        run: |
          code=0
          bash scripts/paridade.sh --arquivos --kit "$GITHUB_WORKSPACE" --time /tmp/claude-config-team | tee /tmp/paridade-arquivos.txt || code=$?
          if [ "$code" != 0 ]; then
            echo "::warning::paridade.sh --arquivos saiu $code. Este job não reprova."
            exit 0
          fi
          n="$(grep -c '^divergiu' /tmp/paridade-arquivos.txt || true)"
          if [ "${n:-0}" != 0 ]; then
            echo "::warning::${n} arquivo(s) de skill/hook divergem do claude-config-team. O job só avisa; veja o log."
          else
            echo "nenhuma divergência de conteúdo fora das exceções."
          fi

  # O ffmpeg vem do apt, que trava de forma intermitente no espelho do runner: em 22 e
  # 23/10/2026 o passo dele consumiu o teto e derrubou o validate, que é o check obrigatório.
  # Num job próprio ele roda em paralelo, o teste do final.sh segue exigindo o ffmpeg de
  # verdade, e quando o apt travar só este job fica vermelho e dá para rodar de novo sozinho.
  # Espelho de VAMOO-AI/claude-config-team#421.
  motion-reel-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ffmpeg para o teste do final.sh da motion-reel
        # Não interativo e com teto próprio: em 22/10/2026, com o ubuntu-latest migrando para o
        # Ubuntu 26, o apt ficou parado aqui até o job estourar (CANCELLED aos 10 e depois aos
        # 20 min). Travar de novo vira falha deste passo em 8 min, com nome, não do job inteiro.
        # Não interativo não bastou: o apt também para no espelho, de forma intermitente (o mesmo
        # passo passou num repo e travou no outro no mesmo minuto). Teto por comando e até 3
        # tentativas; -q (não -qq) para o log dizer onde parou.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for i in 1 2 3; do
            if timeout 150 sudo -E apt-get update -q \
               && timeout 300 sudo -E apt-get install -y -q --no-install-recommends ffmpeg; then
              break
            fi
            echo "::warning::apt do ffmpeg falhou ou passou do teto (tentativa $i de 3)"
            sleep 15
          done
          ffmpeg -version | head -1

      - name: O final.sh da motion-reel reprova áudio fora do alvo, limita o pico, avisa cena parada e preserva o MP4 bom
        # Sem ffmpeg o teste sai "pulado" com exit 0; aqui ele precisa rodar de verdade.
        # O shell padrão do step é `bash -e` sem pipefail: sem ele o tee engole o exit 1 do teste.
        run: |
          set -o pipefail
          bash tests/test-motion-reel-final-verificar.sh | tee /tmp/final-verificar.log
          ! grep -q '^pulado' /tmp/final-verificar.log

      - name: O watch.sh da video-watch cai para intervalo em vídeo parado, avisa do modelo ausente e não aborta
        # Mesmo ffmpeg do passo acima; aqui a parte de vídeo não pode sair "pulado".
        run: |
          set -o pipefail
          bash tests/test-video-watch.sh | tee /tmp/video-watch.log
          ! grep -q '^pulado' /tmp/video-watch.log
