# Atualiza as actions pinadas por SHA nos workflows do kit (ci.yml e release.yml).
# Revise o PR como mudança de CI: versão maior de action pode mudar input e output.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # O branch padrão é o stable (canal dos mentorados) e só avança por promoção em
    # fast-forward. Sem isto o PR do dependabot cai no stable e trava a promoção seguinte.
    target-branch: main
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    open-pull-requests-limit: 5
