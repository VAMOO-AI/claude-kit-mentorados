# Regras que entram no contexto quando você encosta num caminho — uma por linha,
# no formato:  glob | texto da regra
#
# Por que isso existe: regra escrita no CLAUDE.md custa contexto em TODA request
# da sessão, seja ela usada ou não. "Migration é irreversível" não interessa em
# nenhuma sessão que não toca migration. Aqui a regra chega quando (e se) o
# arquivo aparece — uma vez por sessão, sem bloquear nada.
#
# O glob é casado contra o caminho completo (por isso os padrões começam com */).
# Comente com # para desligar sem perder a linha. Adicione as suas: este arquivo
# é o lugar certo para "no MEU projeto, quando mexer em X, lembre de Y".

*/.env | .env não entra no git em hipótese nenhuma. Se já vazou, rotacione as chaves antes de qualquer outra coisa — remover do commit não invalida o que já foi lido. O que se commita é o .env.example, com os nomes das chaves e sem os valores.
*/.env.local | .env.local não entra no git em hipótese nenhuma. Se já vazou, rotacione as chaves antes de qualquer outra coisa. O que se commita é o .env.example, com os nomes das chaves e sem os valores.
*/supabase/migrations/* | Migration: rodar DDL em produção é irreversível. Teste no banco local antes, confirme com quem é dono do dado, e nunca aplique direto num banco de cliente sem autorização explícita. Tabela nova nasce com RLS habilitada e policy no MESMO arquivo — sem isso ela fica aberta ou deny-all em silêncio.
*/supabase/functions/* | Edge function: verify_jwt só fica desligado onde um webhook externo exige, e cada function nessa condição precisa de auth própria (segredo comparado em tempo constante, HMAC, ou token de posse). Deploy sem config.toml reseta verify_jwt=true e derruba o webhook calado.
*/.claude/settings.json | Este arquivo é sobrescrito quando você atualiza o kit. Hook, permissão ou variável nova tem que ir para o kit (ou para settings.local.json), senão some sem aviso no próximo update.
*/package.json | Mexeu em dependência: rode o audit do gerenciador e confira o lockfile no mesmo commit. Dependência que a IA sugeriu e não existe no registro é falha conhecida — se o install falhar com E404, é esse o caso.
